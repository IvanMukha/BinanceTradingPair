spring.application.name=tradingpair

#Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:tradingpair}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

#Liquibase
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml

#External API
binance.url=${BINANCE_URL:https://api.binance.com}
binance.symbol=${BINANCE_POLL_SYMBOL:BTCUSDT}
binance.poll-interval=${BINANCE_POLL_INTERVAL:PT30S}
binance.rate-limit-backoff=PT1M
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=5s


