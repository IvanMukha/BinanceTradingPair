services:

  postgres:
    image: postgres:16-alpine
    container_name: tradingpair-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tradingpair}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tradingpair}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-512m}

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingpair-app
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tradingpair}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      BINANCE_POLL_INTERVAL: ${BINANCE_POLL_INTERVAL:-PT30S}
      BINANCE_POLL_SYMBOL: ${BINANCE_POLL_SYMBOL:-BTCUSDT}
      BINANCE_URL: ${BINANCE_URL:-https://api.binance.com}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT:-1g}

volumes:
  postgres-data: